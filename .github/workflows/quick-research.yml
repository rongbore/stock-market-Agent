name: 快捷股票研究（只读行情）

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: '1–5 只 A 股，空格或逗号分隔；运行即允许只读采集'
        required: true
        default: '000776.SZ'
        type: string
      upstream:
        description: '显式行情来源；供应商日历固定新浪，全部来源未核验'
        required: true
        default: sina
        type: choice
        options:
          - sina
          - eastmoney
      start_date:
        description: '起始日期 YYYY-MM-DD；两日期同时留空使用最近窗口'
        required: false
        default: ''
        type: string
      end_date:
        description: '结束日期 YYYY-MM-DD；必须早于北京时间当天'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install read-only market data dependency
        run: python -m pip install -r requirements-akshare.txt
      - name: Collect, generate and verify research package
        id: research
        continue-on-error: true
        env:
          RESEARCH_SYMBOLS: ${{ inputs.symbols }}
          RESEARCH_UPSTREAM: ${{ inputs.upstream }}
          RESEARCH_START_DATE: ${{ inputs.start_date }}
          RESEARCH_END_DATE: ${{ inputs.end_date }}
        run: python -m scripts.quick_research_action
      - name: Upload research package and verification
        if: always() && steps.research.outputs.artifacts_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quick-research-${{ github.run_id }}
          path: |
            research-output/research.zip
            research-output/verification.json
            research-output/action-result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve incomplete or failed run status
        if: always() && steps.research.outcome != 'success'
        run: |
          echo '研究未全部生成或校验未通过；如有诊断材料，请从 Artifacts 下载。'
          exit 1
