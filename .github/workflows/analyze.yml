name: TradingAgents 中文股票分析

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 股票代码，例如 NVDA、600519.SS、0700.HK
        required: true
        default: NVDA
      date:
        description: 分析日期 YYYY-MM-DD；留空使用北京时间当天
        required: false
      dry_run:
        description: 默认安全离线测试；取消勾选才执行可能产生费用的真实分析
        type: boolean
        required: true
        default: true
      model:
        description: DeepSeek 模型 ID（须在你的账号可用）
        required: true
        default: deepseek-flash

permissions:
  contents: read

concurrency:
  group: tradingagents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check API configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo '::error::请先在仓库 Actions secrets 中配置 DEEPSEEK_API_KEY'
            exit 1
          fi
      - name: Validate analysis inputs before dependency install
        env:
          ANALYSIS_TICKER: ${{ inputs.ticker }}
          ANALYSIS_DATE: ${{ inputs.date }}
          ANALYSIS_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          from scripts.analyze import read_inputs
          ticker, analysis_date, model = read_inputs()
          print(f"Validated input: {ticker}, {analysis_date}, model={model}")
          PY
      - name: Install pinned TradingAgents
        run: python -m pip install 'tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@c4544913a14ed3df5f1ed7b9e8483270ce20682a'
      - name: Analyze stock
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANALYSIS_TICKER: ${{ inputs.ticker }}
          ANALYSIS_DATE: ${{ inputs.date }}
          ANALYSIS_MODEL: ${{ inputs.model }}
        run: python scripts/analyze.py
      - name: Validate report artifacts
        run: python scripts/report_contract.py results/reports --require-metadata
      - name: Guard report artifacts against secret exposure
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/artifact_secret_guard.py results/reports
      - name: Upload reports
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-reports-${{ github.run_id }}
          path: results/reports/
          if-no-files-found: error
          retention-days: 14

  offline-smoke:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create synthetic report fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.provenance import build_manifest, save_manifest
          from scripts.evidence_bundle import validate_evidence_bundle, save_evidence_bundle
          root = Path("results/reports/SYNTHETIC/offline")
          root.mkdir(parents=True, exist_ok=True)
          (root / "complete_report.html").write_text(
              "<!doctype html><html><body>OFFLINE SYNTHETIC TEST ONLY</body></html>",
              encoding="utf-8",
          )
          save_manifest(root, build_manifest("SYNTHETIC", "2026-01-01", "offline-test"))
          save_evidence_bundle(root, validate_evidence_bundle([], analysis_date="2026-01-01"))
          PY
      - name: Validate synthetic report artifacts
        run: python scripts/report_contract.py results/reports --require-metadata
      - name: Guard synthetic report artifacts
        run: python scripts/artifact_secret_guard.py results/reports
      - name: Upload synthetic smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-synthetic-smoke-${{ github.run_id }}
          path: results/reports/
          if-no-files-found: error
          retention-days: 1
