name: AI PR review (read only)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to review'
        required: true
        type: number
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Do not spend model calls on fork PRs. This trusted workflow never checks out PR code.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run advisory AI review without PR checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_ENDPOINT: ${{ vars.AI_REVIEW_ENDPOINT }}
          AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL }}
          AI_REVIEW_ALLOWED_HOSTS: ${{ vars.AI_REVIEW_ALLOWED_HOSTS }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python -m scripts.ai_review_manual_cli --pr-number "$PR_NUMBER" --output ai-review-result.json
      - name: Upload AI review result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
          path: ai-review-result.json
          if-no-files-found: ignore
          retention-days: 14
