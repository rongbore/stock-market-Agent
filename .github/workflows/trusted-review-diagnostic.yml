name: Trusted review diagnostic (read only)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-review-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run read-only diagnostic (informational)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/trusted_review_diagnostic.py ]; then
            echo "Trusted default branch does not yet contain diagnostic; skip until merged."
            exit 0
          fi
          python -m scripts.trusted_review_diagnostic
      - name: Explain current limitations
        run: echo "Diagnostic only; do not require this check or use it to authorize merges."
