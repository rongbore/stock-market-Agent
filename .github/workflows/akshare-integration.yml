name: AKShare read-only integration
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "A-share ticker, e.g. 000776.SZ"
        required: true
        default: "000776.SZ"
      start_date:
        description: "Start date YYYY-MM-DD"
        required: true
        default: "2026-10-01"
      end_date:
        description: "End date YYYY-MM-DD"
        required: true
        default: "2026-10-30"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AKShare
        run: python -m pip install "akshare>=1.16,<2"
      - name: Fetch public read-only A-share daily data
        env:
          STOCK_SYMBOL: ${{ inputs.symbol }}
          STOCK_START_DATE: ${{ inputs.start_date }}
          STOCK_END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.akshare_provider import fetch_a_share_daily
          result = fetch_a_share_daily(
              os.environ["STOCK_SYMBOL"],
              os.environ["STOCK_START_DATE"],
              os.environ["STOCK_END_DATE"],
          )
          if not result["records"]:
              raise RuntimeError("No daily records returned; upstream not verified")
          Path("akshare_daily_snapshot.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("AKShare records:", len(result["records"]))
          print("Date range:", result["records"][0]["date"], result["records"][-1]["date"])
          print("Source content verified:", result["source_content_verified"])
          PY
      - name: Upload unverified data snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: akshare-daily-unverified
          path: akshare_daily_snapshot.json
          retention-days: 3
