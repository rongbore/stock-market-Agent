name: Offline report artifact end-to-end

on:
  pull_request:
    paths:
      - '.github/workflows/offline-artifact-e2e.yml'
      - '.github/workflows/analyze.yml'
      - 'scripts/report_contract.py'
      - 'scripts/artifact_secret_guard.py'
      - 'scripts/provenance.py'
      - 'scripts/evidence_bundle.py'
      - 'scripts/financial_claim_evidence.py'
      - 'scripts/quick_research_action.py'
      - 'scripts/quick_market_research.py'
      - 'scripts/collect_batch_research.py'
      - 'scripts/batch_research_package.py'
      - 'scripts/verify_research_package.py'
      - 'examples/backtest/SYNTHETIC_sma_oos_config.json'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-artifact-e2e.yml'
      - '.github/workflows/analyze.yml'
      - 'scripts/report_contract.py'
      - 'scripts/artifact_secret_guard.py'
      - 'scripts/provenance.py'
      - 'scripts/evidence_bundle.py'
      - 'scripts/financial_claim_evidence.py'
      - 'scripts/quick_research_action.py'
      - 'scripts/quick_market_research.py'
      - 'scripts/collect_batch_research.py'
      - 'scripts/batch_research_package.py'
      - 'scripts/verify_research_package.py'
      - 'examples/backtest/SYNTHETIC_sma_oos_config.json'
      - 'tests/**'

# Cancel obsolete runs for the same PR when a new commit arrives.
# Never cancel unrelated PRs or main-branch verification.
concurrency:
  group: offline-artifact-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  offline-artifact-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create synthetic report and provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.provenance import build_manifest, save_manifest
          from scripts.evidence_bundle import validate_evidence_bundle, save_evidence_bundle
          directory = Path("results/reports/SYNTHETIC/offline")
          directory.mkdir(parents=True, exist_ok=True)
          (directory / "complete_report.html").write_text(
              "<!doctype html><html><body>OFFLINE SYNTHETIC TEST ONLY</body></html>",
              encoding="utf-8",
          )
          save_manifest(directory, build_manifest("SYNTHETIC", "2026-01-01", "offline-test"))
          save_evidence_bundle(directory, validate_evidence_bundle([], analysis_date="2026-01-01"))
          PY
      - name: Validate report structure
        run: python scripts/report_contract.py results/reports --require-metadata
      - name: Scan artifacts for configured secrets
        run: python scripts/artifact_secret_guard.py results/reports
      - name: Verify synthetic metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("results/reports/SYNTHETIC/offline")
          manifest = json.loads((root / "run_provenance.json").read_text(encoding="utf-8"))
          assert manifest["market_data_sources_verified"] is False
          assert manifest["source_records"] == []
          evidence = json.loads((root / "evidence_bundle.json").read_text(encoding="utf-8"))
          assert evidence["records"] == []
          assert evidence["source_content_verified"] is False
          assert evidence["historical_point_in_time_verified"] is False
          assert "OFFLINE SYNTHETIC TEST ONLY" in (root / "complete_report.html").read_text(encoding="utf-8")
          PY
      - name: Verify quick research report, CSV and diagnostics offline
        env:
          SYNTHETIC_QUICK_RESEARCH_ARTIFACT_DIR: ${{ runner.temp }}/synthetic-quick-research
        run: python -m unittest -v tests.test_quick_research_action.QuickResearchActionTests.test_partial_run_builds_downloadable_report_and_csv_offline
      - name: Upload synthetic quick research files
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-quick-research-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/synthetic-quick-research/research.zip
            ${{ runner.temp }}/synthetic-quick-research/verification.json
            ${{ runner.temp }}/synthetic-quick-research/action-result.json
          if-no-files-found: error
          retention-days: 1
      - name: Download synthetic quick research files
        uses: actions/download-artifact@v4
        with:
          name: synthetic-quick-research-${{ github.run_id }}
          path: ${{ runner.temp }}/downloaded-quick-research
      - name: Verify downloaded research files and ZIP
        run: |
          diff -qr "$RUNNER_TEMP/synthetic-quick-research" "$RUNNER_TEMP/downloaded-quick-research"
          python -m scripts.verify_research_package --input "$RUNNER_TEMP/downloaded-quick-research/research.zip"
      - name: Upload synthetic artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-e2e-${{ github.run_id }}
          path: results/reports/
          if-no-files-found: error
          retention-days: 1
