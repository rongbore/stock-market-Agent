name: Python input tests
on:
  pull_request:
  push:
    branches: [main]
# Cancel obsolete runs for the same PR when a new commit arrives.
# Never cancel unrelated PRs or main-branch verification.
concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF parser for integration test
        run: python -m pip install 'pdfplumber>=0.11,<0.13'
      - name: Require real PDF parser and review-manifest integration tests
        run: |
          python - <<'PY'
          import unittest
          import pdfplumber
          suite = unittest.TestSuite()
          for pattern in ('test_offline_pdf_rectangle_integration.py',
                          'test_pdf_review_manifest_integration.py',
                          'test_pdf_bundle_review_end_to_end.py'):
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 5:
              raise SystemExit("PDF parser, manifest or bundle-review integration test failed or was skipped")
          PY
      - name: Run tests (no API key required)
        run: python -m unittest discover -s tests -v
