name: AKShare dual-upstream crosscheck
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/akshare-dual-crosscheck.yml'
      - 'scripts/akshare_dual_smoke.py'
      - 'scripts/akshare_sina_provider.py'
      - 'scripts/akshare_provider.py'
      - 'scripts/akshare_crosscheck.py'
      - 'scripts/akshare_evidence_report.py'
      - 'scripts/market_trend_report.py'
      - 'scripts/trend_chart_overlay.py'
      - 'scripts/trend_indicators.py'
      - 'requirements-akshare.txt'
  schedule:
    # Wednesday 02:20 UTC; recent 21 calendar days cover multiple trading weeks.
    - cron: '20 2 * * 3'
  workflow_dispatch:
    inputs:
      symbol:
        description: A-share ticker
        required: true
        default: '000776.SZ'
      start_date:
        description: Start YYYY-MM-DD
        required: true
        default: '2026-10-01'
      end_date:
        description: End YYYY-MM-DD
        required: true
        default: '2026-10-30'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional read-only market data dependency
        run: python -m pip install -r requirements-akshare.txt
      - name: Resolve rolling dates for scheduled runs
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          echo "STOCK_START_DATE=$(date -u -d '21 days ago' +%F)" >> "$GITHUB_ENV"
          echo "STOCK_END_DATE=$(date -u -d 'yesterday' +%F)" >> "$GITHUB_ENV"
      - name: Fetch and compare independent upstreams
        env:
          STOCK_SYMBOL: ${{ inputs.symbol || '000776.SZ' }}
          STOCK_START_DATE: ${{ env.STOCK_START_DATE || inputs.start_date || '2026-10-01' }}
          STOCK_END_DATE: ${{ env.STOCK_END_DATE || inputs.end_date || '2026-10-30' }}
        run: |
          python -m scripts.akshare_dual_smoke \
            --symbol "$STOCK_SYMBOL" \
            --start-date "$STOCK_START_DATE" \
            --end-date "$STOCK_END_DATE" \
            --output-dir dual_output
      - name: Generate offline Chinese evidence report
        if: always()
        run: |
          if [ -f dual_output/dual_upstream_diagnostics.json ]; then
            python -m scripts.akshare_evidence_report \
              --input-dir dual_output \
              --output dual_output/dual_source_evidence_unverified.md
          fi
      - name: Generate offline price trend charts from validated dual snapshots
        if: always()
        shell: bash
        run: |
          if [ -f dual_output/eastmoney_daily_unverified.json ] && \
             [ -f dual_output/sina_daily_unverified.json ] && \
             [ -f dual_output/daily_crosscheck_report.json ]; then
            python -m scripts.market_trend_report \
              --primary dual_output/eastmoney_daily_unverified.json \
              --secondary dual_output/sina_daily_unverified.json \
              --comparison dual_output/daily_crosscheck_report.json \
              --output-dir dual_output
          else
            echo "Trend charts skipped: required snapshot or comparison artifact missing."
          fi
      - name: Publish safe acceptance summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path("dual_output")
          lines = ["## AKShare dual-upstream acceptance", "",
                   "Scope: numerical comparison only; not exchange-authoritative verification.", ""]
          diag_path = folder / "dual_upstream_diagnostics.json"
          if diag_path.is_file():
              diag = json.loads(diag_path.read_text(encoding="utf-8"))
              lines += [
                  f"- Diagnostic status: {diag.get('status', 'unknown')}",
                  f"- Last stage: {diag.get('stage', 'unknown')}",
                  f"- Safe error category: {diag.get('error_category') or 'none'}",
                  f"- Eastmoney status: {diag.get('eastmoney_status', 'unknown')}",
                  f"- Eastmoney attempts: {diag.get('eastmoney_attempts', 'unknown')}",
                  f"- Eastmoney error kind: {diag.get('eastmoney_error_kind') or 'none'}",
                  f"- Sina status: {diag.get('sina_status', 'unknown')}",
                  f"- Sina attempts: {diag.get('sina_attempts', 'unknown')}",
                  f"- Sina error kind: {diag.get('sina_error_kind') or 'none'}",
                  f"- Eastmoney records: {diag.get('eastmoney_record_count', 0)}",
                  f"- Sina records: {diag.get('sina_record_count', 0)}",
              ]
          else:
              lines.append("- Diagnostic file missing (job may have failed before collection).")
          report_path = folder / "daily_crosscheck_report.json"
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              lines += [f"- Numerical agreement: {report.get('cross_source_numerical_agreement', False)}",
                        f"- Difference count: {report.get('difference_count', 'unknown')}"]
              coverage = report.get("date_coverage", {})
              lines += [
                  f"- Shared trading dates: {coverage.get('shared_trading_date_count', 'unknown')}",
                  f"- Eastmoney-only dates: {coverage.get('primary_only_date_count', 'unknown')}",
                  f"- Sina-only dates: {coverage.get('secondary_only_date_count', 'unknown')}",
                  "- Exchange calendar checked: false",
              ]
          else:
              lines.append("- Comparison report unavailable.")
          lines.append("- Independent source verified: false")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Upload unverified crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akshare-dual-upstream-unverified
          path: |
            dual_output/*.json
            dual_output/*.md
            dual_output/*.html
          if-no-files-found: warn
          retention-days: 3
